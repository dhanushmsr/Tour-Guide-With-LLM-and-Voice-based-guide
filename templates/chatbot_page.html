{% extends "base.html" %}

{% block title %}Vardhan Assistant | Your Travel Expert{% endblock %}

{% block extra_head %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
    }

    /* Premium Light Theme Chat Container */
    .glass-chat-container { 
        background: rgba(255, 255, 255, 0.9); 
        backdrop-filter: blur(24px); 
        border: 1px solid #e2e8f0; 
        box-shadow: 0 10px 40px -10px rgba(0,0,0,0.08); 
    }
    
    .bot-bubble { 
        background: #f8fafc; 
        border: 1px solid #e2e8f0; 
        color: #334155;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
    }
    
    .user-bubble { 
        background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); 
        color: #ffffff;
        box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.2); 
    }

    #chat-box { 
        height: calc(100vh - 280px); 
        overflow-y: auto; 
        scroll-behavior: smooth; 
    }
    
    /* Custom scrollbar for chat */
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-track { background: transparent; }
    #chat-box::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    #chat-box::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Typing Animation */
    .typing-dot { animation: typing 1.4s infinite; display: inline-block; width: 6px; height: 6px; margin: 0 2px; background: #f97316; border-radius: 50%; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
    
    /* Fade In Animation */
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* AI Formatting Fixes */
    .bot-message-content strong { color: #0f172a; font-weight: 700; }
    .bot-message-content br { margin-bottom: 0.5rem; display: block; content: ""; }
    .bot-message-content li { margin-left: 1rem; list-style-type: disc; color: #f97316; }
    .bot-message-content li span { color: #475569; }
</style>
{% endblock %}

{% block content %}
<div class="container mx-auto max-w-4xl px-6 py-6 flex flex-col justify-between h-full">
    
    <div class="glass-chat-container rounded-t-[2rem] p-6 flex justify-between items-center border-b border-slate-100 z-10">
        <div class="flex items-center gap-4">
            <div class="w-14 h-14 bg-orange-50 rounded-full flex items-center justify-center text-3xl border border-orange-200 shadow-sm">
                <img src="/static/images/icon.png" alt="Bot Icon" class="w-8 h-8 object-contain">
            </div>
            <div>
                <h2 class="text-2xl font-bold text-slate-800 tracking-tight">Vardhan <span class="text-orange-600">Assistant</span></h2>
                <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider flex items-center gap-2 mt-0.5">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span> Your AI Travel Concierge
                </p>
            </div>
        </div>
        <button onclick="clearChat()" class="w-10 h-10 rounded-full bg-slate-50 border border-slate-200 hover:bg-red-50 text-slate-400 hover:text-red-500 hover:border-red-200 transition-all flex items-center justify-center shadow-sm" title="Reset Conversation">
            <i class="fas fa-redo-alt text-sm"></i>
        </button>
    </div>

    <div class="glass-chat-container flex-1 p-6 sm:p-8 -mt-2 relative z-0 border-y-0">
        <div id="chat-box" class="space-y-6 pr-2 mb-6">
            </div>

        <div id="typing-indicator" class="hidden mb-4 animate-fade-in">
            <div class="flex items-center gap-3 bot-bubble w-fit px-5 py-4 rounded-2xl rounded-tl-none">
                <div class="w-6 h-6 rounded-full bg-orange-100 flex items-center justify-center text-[10px]"><i class="fas fa-robot text-orange-500"></i></div>
                <div class="flex"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
            </div>
        </div>
    </div>

    <div class="glass-chat-container rounded-b-[2rem] p-4 -mt-2 z-10">
        <div class="flex gap-4 items-center bg-white border border-slate-200 p-2 rounded-2xl focus-within:border-orange-500 focus-within:shadow-[0_0_0_4px_rgba(249,115,22,0.1)] transition-all shadow-inner">
            <input type="text" id="userInput" onkeypress="handleKeyPress(event)" placeholder="Ask about destinations, itineraries, or cultural history..." class="flex-1 bg-transparent px-4 py-3 outline-none font-medium placeholder:text-slate-400 text-slate-800 text-base">
            <button onclick="processInput()" class="w-12 h-12 bg-orange-600 rounded-xl flex items-center justify-center hover:bg-orange-500 text-white transition-all shadow-md transform hover:-translate-y-0.5 flex-shrink-0">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const chatBox = document.getElementById('chat-box');
    const typingIndicator = document.getElementById('typing-indicator');
    const userInput = document.getElementById('userInput');

    document.addEventListener('DOMContentLoaded', () => {
        const savedName = localStorage.getItem('inkwake_username') || 'Traveler';
        
        const welcomeMessage = `Namaste, <b>${savedName}</b>! I am the <b>Vardhan Assistant</b>. I am here to help you plan your perfect Indian heritage journey. How may I assist you today?`;
        appendMessage('AI', welcomeMessage, false);

        // Inject Quick Reply Buttons
        const quickRepliesHtml = `
            <div class="flex flex-col sm:flex-row flex-wrap gap-3 mt-5 animate-fade-in" id="quick-replies-container">
                <button onclick="handleQuickAction('Explore your tour packages')" class="px-5 py-3 rounded-xl border border-orange-200 text-orange-700 text-sm font-semibold hover:bg-orange-50 transition-all bg-white shadow-sm flex items-center gap-2">
                    <i class="fas fa-map-marked-alt text-orange-500"></i> Explore Tours
                </button>
                <button onclick="handleQuickAction('Help me choose a destination')" class="px-5 py-3 rounded-xl border border-blue-200 text-blue-700 text-sm font-semibold hover:bg-blue-50 transition-all bg-white shadow-sm flex items-center gap-2">
                    <i class="fas fa-magic text-blue-500"></i> Inspire Me
                </button>
                <button onclick="handleQuickAction('Contact customer support')" class="px-5 py-3 rounded-xl border border-green-200 text-green-700 text-sm font-semibold hover:bg-green-50 transition-all bg-white shadow-sm flex items-center gap-2">
                    <i class="fas fa-headset text-green-500"></i> Contact Support
                </button>
            </div>
        `;
        chatBox.innerHTML += quickRepliesHtml;
    });

    function handleKeyPress(e) { if (e.key === 'Enter') processInput(); }

    function clearChat() {
        if(confirm("Are you sure you want to clear this conversation?")) { 
            chatBox.innerHTML = ''; 
            location.reload(); 
        }
    }

    function formatAIResponse(text) {
        let formatted = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>'); 
        formatted = formatted.replace(/^\*\s+(.*)/gm, '<li><span>$1</span></li>'); 
        formatted = formatted.replace(/\n/g, '<br>'); 
        return formatted;
    }

    function appendMessage(sender, text, allowVoice = true, isRawHTML = false) {
        const isAI = sender === 'AI';
        const displayText = isRawHTML ? text : formatAIResponse(text);

        const msgHtml = `
            <div class="flex gap-4 ${isAI ? '' : 'justify-end'} animate-fade-in w-full">
                ${isAI ? `<div class="w-10 h-10 rounded-full bg-white flex-shrink-0 flex items-center justify-center border border-slate-200 shadow-sm z-10"><img src="/static/images/icon.png" class="w-6 h-6 object-contain"></div>` : ''}
                
                <div class="${isAI ? 'bot-bubble' : 'user-bubble'} p-5 rounded-[1.5rem] ${isAI ? 'rounded-tl-none' : 'rounded-tr-none'} max-w-[85%] md:max-w-[75%] relative group">
                    <div class="text-[15px] font-medium leading-relaxed bot-message-content">${displayText}</div>
                    
                    ${(isAI && allowVoice && !isRawHTML) ? `<button onclick="playVoice(this)" data-text="${text.replace(/"/g, '&quot;')}" class="absolute -right-12 bottom-2 w-9 h-9 rounded-full bg-white text-slate-500 hover:text-orange-600 hover:border-orange-200 transition-all opacity-0 group-hover:opacity-100 flex items-center justify-center shadow-md border border-slate-200"><i class="fas fa-volume-up text-sm"></i></button>` : ''}
                </div>
                
                ${!isAI ? `<div class="w-10 h-10 rounded-full bg-slate-800 flex-shrink-0 flex items-center justify-center text-[10px] font-bold text-white z-10 shadow-sm">YOU</div>` : ''}
            </div>`;
        
        chatBox.innerHTML += msgHtml;
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    }

    // Custom Action Responses
    function handleQuickAction(action) {
        const qrContainer = document.getElementById('quick-replies-container');
        if (qrContainer) qrContainer.remove();
        
        appendMessage('YOU', action);

        if (action === 'Contact customer support') {
            const supportCard = `
                <p class="mb-4">Our travel curators are available to assist you. Please choose your preferred method of contact:</p>
                <div class="grid grid-cols-1 gap-3">
                    <a href="tel:9566960500" class="flex items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 hover:border-green-400 hover:shadow-md transition-all group">
                        <div class="w-12 h-12 rounded-full bg-green-50 text-green-600 flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-phone-alt"></i></div>
                        <div><p class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Call / WhatsApp</p><p class="text-slate-800 font-bold text-lg">+91 9566960500</p></div>
                    </a>
                    <a href="mailto:mdhanushdsm@gmail.com" class="flex items-center gap-4 bg-white p-4 rounded-xl border border-slate-200 hover:border-blue-400 hover:shadow-md transition-all group">
                        <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center text-xl group-hover:scale-110 transition-transform"><i class="fas fa-envelope"></i></div>
                        <div><p class="text-[10px] text-slate-500 uppercase tracking-wider font-bold">Email Support</p><p class="text-slate-800 font-bold text-sm">mdhanushdsm@gmail.com</p></div>
                    </a>
                </div>
            `;
            setTimeout(() => appendMessage('AI', supportCard, false, true), 400);
            return;
        }

        if (action === 'Explore your tour packages') {
            const tripsCard = `
                <p class="mb-4">We offer a curated selection of premium heritage tours, complete with luxury stays and expert guides.</p>
                <a href="/explorer" class="w-full bg-orange-50 hover:bg-orange-100 border border-orange-200 py-3.5 rounded-xl text-orange-700 font-bold text-sm transition-all flex items-center justify-center gap-2 block text-center shadow-sm">
                    <i class="fas fa-compass"></i> View All Packages
                </a>
            `;
            setTimeout(() => appendMessage('AI', tripsCard, false, true), 400);
            return;
        }

        if (action === 'Help me choose a destination') {
            const chooseCard = `
                <p class="mb-4">I would love to help you find the perfect trip! What type of experience are you looking for?</p>
                <div class="flex flex-col gap-2">
                    <button onclick="processInput('I want to see grand ancient temples and architecture.')" class="bg-white hover:bg-slate-50 text-left px-5 py-4 rounded-xl border border-slate-200 shadow-sm text-sm font-semibold text-slate-700 transition-colors flex items-center gap-3"><i class="fas fa-gopuram text-orange-500 text-lg w-6 text-center"></i> Ancient Temples & Architecture</button>
                    <button onclick="processInput('I prefer coastal views and historical rock carvings.')" class="bg-white hover:bg-slate-50 text-left px-5 py-4 rounded-xl border border-slate-200 shadow-sm text-sm font-semibold text-slate-700 transition-colors flex items-center gap-3"><i class="fas fa-water text-blue-500 text-lg w-6 text-center"></i> Coastal Views & Carvings</button>
                    <button onclick="processInput('I am looking for a deep spiritual and cultural journey.')" class="bg-white hover:bg-slate-50 text-left px-5 py-4 rounded-xl border border-slate-200 shadow-sm text-sm font-semibold text-slate-700 transition-colors flex items-center gap-3"><i class="fas fa-om text-purple-500 text-lg w-6 text-center"></i> Spiritual & Cultural Depth</button>
                </div>
            `;
            setTimeout(() => appendMessage('AI', chooseCard, false, true), 400);
            return;
        }
    }

    async function processInput(overrideText = null) {
        const query = overrideText || userInput.value.trim();
        if(!query) return;
        
        const qrContainer = document.getElementById('quick-replies-container');
        if (qrContainer) qrContainer.remove();

        appendMessage('YOU', query);
        if(!overrideText) userInput.value = '';
        typingIndicator.classList.remove('hidden');
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });

        try {
            const username = localStorage.getItem('inkwake_username') || 'Explorer';
            const lang = localStorage.getItem('inkwake_lang') || 'en';
            
            const response = await fetch('/chatbot/ask', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ query, lang, username })
            });
            const data = await response.json();
            typingIndicator.classList.add('hidden');
            appendMessage('AI', data.status === "success" ? data.response : (data.response || "I apologize, but I am having trouble connecting to my database. Please try again in a moment."));
        } catch(e) {
            typingIndicator.classList.add('hidden');
            appendMessage('AI', "Transmission failed. Please check your internet connection.");
        }
    }

    async function playVoice(btn) {
        const text = btn.getAttribute('data-text');
        btn.innerHTML = '<i class="fas fa-spinner animate-spin text-xs"></i>';
        try {
            const lang = localStorage.getItem('inkwake_lang') || 'en';
            const res = await fetch(`/chatbot/voice-guide?text=${encodeURIComponent(text)}&lang=${lang}`);
            const data = await res.json();
            if(data.audio_url) new Audio(data.audio_url).play();
        } catch(e) { console.error("Voice Node Offline"); }
        setTimeout(() => { btn.innerHTML = '<i class="fas fa-volume-up text-xs"></i>'; }, 1000);
    }
</script>
{% endblock %}
