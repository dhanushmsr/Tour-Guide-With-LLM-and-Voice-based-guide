{% extends "base.html" %}

{% block title %}Admin Login | Vardhan Holidays India{% endblock %}

{% block extra_head %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    
    /* Scoped styling to enforce the light, clean theme */
    .login-wrapper {
        font-family: 'Inter', sans-serif;
        /* Beautiful light gradient matching your new aesthetic */
        background: linear-gradient(135deg, #fffbeb 0%, #ffffff 50%, #f0f9ff 100%);
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3rem 1.5rem;
        border-radius: 2rem;
        margin: 1rem;
    }

    /* Soft, floating card effect */
    .login-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid #f1f5f9;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        border-radius: 2rem;
    }

    /* Clean input fields */
    .login-input {
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 1.25rem;
        border-radius: 1rem;
        color: #0f172a;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        transition: all 0.3s ease;
        font-size: 1.25rem;
        letter-spacing: 0.2em;
        text-align: center;
    }

    .login-input:focus {
        border-color: #f97316;
        box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.1);
        outline: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card p-10 max-w-md w-full">
        <div class="text-center mb-10">
            <img src="/static/images/logo.png" alt="Vardhan Holidays India" class="h-16 object-contain mx-auto mb-6">
            
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Admin Portal</h1>
            <p class="text-slate-500 text-sm font-medium mt-2">Sign in to manage your packages</p>
        </div>

        <script>
            // Clean, user-friendly error state
            if (new URLSearchParams(window.location.search).has('error')) {
                document.write(`
                    <div class="mb-6 p-4 bg-red-50 border border-red-200 rounded-xl text-red-600 text-sm font-semibold text-center flex items-center justify-center gap-2">
                        <i class="fas fa-exclamation-circle"></i> Incorrect password. Please try again.
                    </div>
                `);
            }
        </script>

        <form action="/admin/login" method="post" class="space-y-6">
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-500 uppercase ml-1">Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="login-input">
            </div>
            
            <button type="submit" class="w-full bg-orange-600 hover:bg-orange-500 py-4 rounded-xl font-bold text-sm transition-all shadow-lg hover:shadow-orange-500/30 text-white flex items-center justify-center gap-2">
                <i class="fas fa-lock-open"></i> Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
